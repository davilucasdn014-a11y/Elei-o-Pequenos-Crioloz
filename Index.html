<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urna Eletrônica — Rei Criolo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="urna">
  <div class="topo">ELEIÇÃO — REI CRIOLO</div>
  <div class="conteudo">
    <div class="tela">
      <div class="titulo">VOTO PARA<br><strong>REI CRIOLO</strong></div>
      <div id="mensagem" class="mensagem">Digite o número do candidato</div>
      <div class="dados">
        <div class="campos">
          <div>NÚMERO: <span id="numero">_ _</span></div>
          <div>NOME: <span id="nome">________________</span></div>
        </div>
        <div id="foto" class="foto">FOTO</div>
      </div>
      <div class="instrucao">Digite 2 números para continuar.</div>
    </div>

    <div class="teclado">
      <div class="teclas">
        <button onclick="digitar('1')">1</button>
        <button onclick="digitar('2')">2</button>
        <button onclick="digitar('3')">3</button>
        <button onclick="digitar('4')">4</button>
        <button onclick="digitar('5')">5</button>
        <button onclick="digitar('6')">6</button>
        <button onclick="digitar('7')">7</button>
        <button onclick="digitar('8')">8</button>
        <button onclick="digitar('9')">9</button>
        <button class="zero" onclick="digitar('0')">0</button>
      </div>
      <div class="acoes">
        <button class="branco" onclick="branco()">BRANCO</button>
        <button class="corrige" onclick="corrigir()">CORRIGE</button>
        <button class="confirma" onclick="confirmar()">CONFIRMA</button>
      </div>
    </div>
  </div>
</div>

<div class="resultado">
  <h2>APURAÇÃO</h2>
  <p>Contagem local desta urna.</p>
  <div id="placar"></div>
  <button class="reset" onclick="resetar()">Zerar votação</button>
</div>

<script src="script.js"></script>
</body>
</html>
